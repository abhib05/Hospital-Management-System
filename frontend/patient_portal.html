<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HMS – Patient Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/api.js"></script>
</head>
<body class="bg-gray-50">

<!-- NAVBAR -->
<nav class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between shadow-sm sticky top-0 z-40">
  <div class="flex items-center gap-3">
    <div class="w-8 h-8 bg-purple-600 rounded-lg flex items-center justify-center">
      <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
      </svg>
    </div>
    <span class="font-bold text-gray-800 text-lg">HMS</span>
    <span class="text-gray-400 text-sm hidden sm:block">/ Patient Portal</span>
  </div>
  <div class="flex items-center gap-2">
    <button onclick="showTab('overview')"   id="tab-overview"   class="tab-btn text-sm px-3 py-1.5 rounded-lg bg-purple-100 text-purple-700 font-medium">Overview</button>
    <button onclick="showTab('appts')"      id="tab-appts"      class="tab-btn text-sm px-3 py-1.5 rounded-lg text-gray-500 hover:bg-gray-100">Appointments</button>
    <button onclick="showTab('billing')"    id="tab-billing"    class="tab-btn text-sm px-3 py-1.5 rounded-lg text-gray-500 hover:bg-gray-100">Billing</button>
    <button onclick="logout()" class="text-sm text-gray-400 hover:text-red-600 ml-2">Logout</button>
  </div>
</nav>

<!-- OVERVIEW TAB -->
<div id="panel-overview" class="max-w-4xl mx-auto px-4 py-6 space-y-6">
  <!-- Profile card (masked by default) -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
    <div class="flex items-start justify-between">
      <div class="flex items-center gap-4">
        <div class="w-14 h-14 bg-purple-100 rounded-full flex items-center justify-center text-2xl">🧑</div>
        <div>
          <h2 id="p-name" class="text-xl font-bold text-gray-900">—</h2>
          <p id="p-meta" class="text-sm text-gray-500 mt-0.5">—</p>
        </div>
      </div>
      <div class="text-right">
        <p class="text-xs text-gray-400 mb-1">Sensitive data is masked</p>
        <button onclick="revealFullProfile()"
          class="text-xs bg-purple-100 hover:bg-purple-200 text-purple-700 font-medium px-3 py-1.5 rounded-lg transition">
          🔓 Reveal Full Profile
        </button>
      </div>
    </div>
    <div id="p-details" class="mt-4 grid grid-cols-2 sm:grid-cols-4 gap-4 text-sm"></div>
  </div>

  <!-- Upcoming appointments summary -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
    <h3 class="font-semibold text-gray-800 mb-3">Upcoming Appointments</h3>
    <div id="upcoming-appts" class="space-y-2">
      <p class="text-sm text-gray-400">Loading…</p>
    </div>
  </div>

  <!-- Book new appointment -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
    <h3 class="font-semibold text-gray-800 mb-4">Book an Appointment</h3>
    <form id="book-form" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Doctor</label>
        <select id="book-doctor"
          class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-purple-400 outline-none">
          <option value="">Loading doctors…</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Date & Time</label>
        <input id="book-datetime" type="datetime-local"
          class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-purple-400 outline-none"/>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Reason (optional)</label>
        <input id="book-reason" type="text" placeholder="e.g. Routine check-up"
          class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-purple-400 outline-none"/>
      </div>
      <div class="sm:col-span-3">
        <button id="book-btn" type="submit"
          class="bg-purple-600 hover:bg-purple-700 text-white font-semibold px-6 py-2.5 rounded-lg text-sm transition">
          Book Appointment
        </button>
      </div>
    </form>
  </div>
</div>

<!-- APPOINTMENTS TAB -->
<div id="panel-appts" class="hidden max-w-4xl mx-auto px-4 py-6">
  <h2 class="text-lg font-bold text-gray-800 mb-4">My Appointments</h2>
  <div id="all-appts" class="space-y-3">
    <p class="text-sm text-gray-400">Loading…</p>
  </div>
</div>

<!-- BILLING TAB -->
<div id="panel-billing" class="hidden max-w-4xl mx-auto px-4 py-6">
  <h2 class="text-lg font-bold text-gray-800 mb-4">My Invoices</h2>
  <div id="invoices-list" class="space-y-3">
    <p class="text-sm text-gray-400">Loading…</p>
  </div>
</div>

<script>
let patientProfile = null;

document.addEventListener("DOMContentLoaded", async () => {
  Auth.redirectIfNotLoggedIn("Patient");
  await loadProfile();
  await loadUpcoming();
  await loadDoctors();
});

// ── Tabs ──────────────────────────────────────────────────────────────────────
function showTab(tab) {
  ["overview","appts","billing"].forEach(t => {
    document.getElementById(`panel-${t}`).classList.toggle("hidden", t !== tab);
    const btn = document.getElementById(`tab-${t}`);
    btn.className = t === tab
      ? "tab-btn text-sm px-3 py-1.5 rounded-lg bg-purple-100 text-purple-700 font-medium"
      : "tab-btn text-sm px-3 py-1.5 rounded-lg text-gray-500 hover:bg-gray-100";
  });
  if (tab === "appts")   loadAllAppts();
  if (tab === "billing") loadBilling();
}

// ── Profile ───────────────────────────────────────────────────────────────────
async function loadProfile() {
  try {
    const p = await api.get("/api/patients/me");
    patientProfile = p;
    document.getElementById("p-name").textContent = p.full_name;
    document.getElementById("p-meta").textContent = `${p.gender} · DOB: ${formatDate(p.dob)} · Blood: ${p.blood_group || 'N/A'}`;
    renderDetails(p);
  } catch(e) {}
}

function renderDetails(p) {
  document.getElementById("p-details").innerHTML = `
    <div class="bg-gray-50 rounded-lg p-3">
      <p class="text-xs text-gray-400 mb-0.5">Phone</p>
      <p class="font-medium text-gray-700">${p.phone || '—'}</p>
    </div>
    <div class="bg-gray-50 rounded-lg p-3">
      <p class="text-xs text-gray-400 mb-0.5">Address</p>
      <p class="font-medium text-gray-700">${p.address || '—'}</p>
    </div>
    <div class="bg-gray-50 rounded-lg p-3">
      <p class="text-xs text-gray-400 mb-0.5">Medical History</p>
      <p class="font-medium text-gray-700">${typeof p.medical_history === 'object' ? JSON.stringify(p.medical_history) : (p.medical_history || '—')}</p>
    </div>
    <div class="bg-gray-50 rounded-lg p-3">
      <p class="text-xs text-gray-400 mb-0.5">Status</p>
      <span class="text-xs bg-green-100 text-green-700 font-medium px-2 py-0.5 rounded-full">Active</span>
    </div>`;
}

async function revealFullProfile() {
  try {
    const p = await api.get("/api/patients/me/full");
    patientProfile = p;
    renderDetails(p);
    showToast("Full profile revealed. Access logged for audit.", "info");
  } catch(e) {
    showToast("Failed to load full profile.", "error");
  }
}

// ── Appointments ──────────────────────────────────────────────────────────────
async function loadUpcoming() {
  try {
    const appts = await api.get("/api/patients/me/appointments");
    const upcoming = appts.filter(a => a.status === "Scheduled");
    const el = document.getElementById("upcoming-appts");
    if (!upcoming.length) {
      el.innerHTML = `<p class="text-sm text-gray-400">No upcoming appointments.</p>`;
      return;
    }
    el.innerHTML = upcoming.slice(0,3).map(a => `
      <div class="flex items-center justify-between bg-purple-50 rounded-lg px-4 py-3 border border-purple-100">
        <div>
          <p class="text-sm font-semibold text-gray-800">Dr. ${a.doctor_name}</p>
          <p class="text-xs text-gray-500">${a.specialization} · ${formatDateTime(a.scheduled_at)}</p>
        </div>
        <span class="text-xs bg-blue-100 text-blue-700 font-medium px-2 py-0.5 rounded-full">Scheduled</span>
      </div>`).join('');
  } catch(e) {}
}

async function loadAllAppts() {
  const el = document.getElementById("all-appts");
  try {
    const appts = await api.get("/api/patients/me/appointments");
    if (!appts.length) {
      el.innerHTML = `<p class="text-sm text-gray-400">No appointments yet.</p>`;
      return;
    }
    el.innerHTML = appts.map(a => `
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm px-5 py-4 flex items-center justify-between">
        <div>
          <p class="font-semibold text-gray-800">Dr. ${a.doctor_name}</p>
          <p class="text-xs text-gray-500">${a.specialization} · ${formatDateTime(a.scheduled_at)}</p>
          ${a.reason ? `<p class="text-xs text-gray-400 italic mt-0.5">${a.reason}</p>` : ''}
        </div>
        <span class="text-xs font-medium px-2.5 py-1 rounded-full ${statusColor(a.status)}">${a.status}</span>
      </div>`).join('');
  } catch(err) {
    el.innerHTML = `<p class="text-sm text-red-500">${err.message}</p>`;
  }
}

function statusColor(s) {
  return {Scheduled:"bg-blue-100 text-blue-700",Completed:"bg-green-100 text-green-700",
    "No-Show":"bg-gray-100 text-gray-500",Cancelled:"bg-red-100 text-red-500"}[s]||"bg-gray-100 text-gray-600";
}

// ── Billing ───────────────────────────────────────────────────────────────────
async function loadBilling() {
  const el = document.getElementById("invoices-list");
  try {
    const invoices = await api.get("/api/patients/me/invoices");
    if (!invoices.length) {
      el.innerHTML = `<p class="text-sm text-gray-400">No invoices yet.</p>`;
      return;
    }
    el.innerHTML = invoices.map(inv => `
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-5">
        <div class="flex items-start justify-between">
          <div>
            <p class="font-semibold text-gray-800">Invoice #${inv.id}</p>
            <p class="text-xs text-gray-500">Dr. ${inv.doctor_name} · ${formatDate(inv.scheduled_at)}</p>
          </div>
          <span class="text-xs font-medium px-2.5 py-1 rounded-full ${inv.payment_status === 'Paid' ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}">
            ${inv.payment_status}
          </span>
        </div>
        <div class="mt-3 grid grid-cols-3 gap-3 text-sm">
          <div class="bg-gray-50 rounded-lg p-2.5">
            <p class="text-xs text-gray-400">Consultation</p>
            <p class="font-semibold text-gray-800">${formatCurrency(inv.consultation_fee)}</p>
          </div>
          <div class="bg-gray-50 rounded-lg p-2.5">
            <p class="text-xs text-gray-400">Pharmacy</p>
            <p class="font-semibold text-gray-800">${formatCurrency(inv.pharmacy_total)}</p>
          </div>
          <div class="bg-blue-50 rounded-lg p-2.5">
            <p class="text-xs text-blue-500">Total</p>
            <p class="font-bold text-blue-700">${formatCurrency(inv.grand_total)}</p>
          </div>
        </div>
      </div>`).join('');
  } catch(err) {
    el.innerHTML = `<p class="text-sm text-red-500">${err.message}</p>`;
  }
}

// ── Book appointment ──────────────────────────────────────────────────────────
async function loadDoctors() {
  try {
    const doctors = await api.get("/api/doctors/list");
    const sel = document.getElementById("book-doctor");
    sel.innerHTML = doctors.map(d => `<option value="${d.id}">${d.full_name} – ${d.specialization} (${formatCurrency(d.fees)})</option>`).join('');
  } catch(e) {}
}

document.getElementById("book-form").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("book-btn");
  showSpinner(btn, "Booking…");
  try {
    await api.post("/api/patients/me/appointments", {
      doctor_id:    parseInt(document.getElementById("book-doctor").value),
      scheduled_at: document.getElementById("book-datetime").value,
      reason:       document.getElementById("book-reason").value || null,
    });
    showToast("Appointment Booked!", "success");
    document.getElementById("book-form").reset();
    await loadUpcoming();
  } catch(err) {
    showToast("Booking failed: " + err.message, "error");
  } finally {
    hideSpinner(btn);
  }
});

function logout() {
  Auth.clearSession();
  window.location.href = "/index.html";
}
</script>
</body>
</html>
