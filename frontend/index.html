<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HMS – Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/api.js"></script>
</head>
<body class="min-h-full bg-gradient-to-br from-blue-900 via-blue-800 to-indigo-900 flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <!-- Logo / Header -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-white rounded-2xl shadow-xl mb-4">
        <svg class="w-10 h-10 text-blue-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
        </svg>
      </div>
      <h1 class="text-3xl font-bold text-white">Hospital Management</h1>
      <p class="text-blue-300 mt-1">Secure Staff & Patient Portal</p>
    </div>

    <!-- Tab switcher -->
    <div class="flex bg-white/10 rounded-xl p-1 mb-4">
      <button id="tab-login" onclick="switchTab('login')"
        class="flex-1 py-2 text-sm font-semibold rounded-lg bg-white text-blue-700 transition">
        Sign In
      </button>
      <button id="tab-register" onclick="switchTab('register')"
        class="flex-1 py-2 text-sm font-semibold rounded-lg text-white/70 hover:text-white transition">
        New Patient? Register
      </button>
    </div>

    <!-- ── LOGIN PANEL ── -->
    <div id="panel-login" class="bg-white rounded-2xl shadow-2xl p-8">
      <h2 class="text-xl font-semibold text-gray-800 mb-6">Sign In to Your Account</h2>
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
          <input id="username" type="text" required autocomplete="username"
            placeholder="Enter your username"
            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm
                   focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <div class="relative">
            <input id="password" type="password" required autocomplete="current-password"
              placeholder="Enter your password"
              class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm
                     focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition pr-10"/>
            <button type="button" id="toggle-pw"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0zM2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            </button>
          </div>
        </div>
        <div id="error-msg" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2"></div>
        <button id="login-btn" type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition text-sm mt-2">
          Sign In
        </button>
      </form>

      <!-- Demo credentials -->
      <div class="mt-6 pt-6 border-t border-gray-100">
        <p class="text-xs text-gray-500 font-medium mb-2">Demo Credentials (password: <code class="bg-gray-100 px-1 rounded">Password123!</code>)</p>
        <div class="grid grid-cols-2 gap-2" id="demo-btns">
          <button class="demo-btn text-xs px-2 py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-lg transition" data-u="dr_smith"    data-p="Password123!">👨‍⚕️ Doctor</button>
          <button class="demo-btn text-xs px-2 py-1.5 bg-green-50 hover:bg-green-100 text-green-700 rounded-lg transition" data-u="pharmacist1" data-p="Password123!">💊 Pharmacist</button>
          <button class="demo-btn text-xs px-2 py-1.5 bg-purple-50 hover:bg-purple-100 text-purple-700 rounded-lg transition" data-u="patient_john" data-p="Password123!">🧑 Patient</button>
          <button class="demo-btn text-xs px-2 py-1.5 bg-red-50 hover:bg-red-100 text-red-700 rounded-lg transition" data-u="admin"        data-p="Password123!">🔒 Admin</button>
        </div>
      </div>
    </div>

    <!-- ── REGISTER PANEL ── -->
    <div id="panel-register" class="hidden bg-white rounded-2xl shadow-2xl p-8">
      <h2 class="text-xl font-semibold text-gray-800 mb-1">Create Patient Account</h2>
      <p class="text-sm text-gray-500 mb-6">Register and book your first appointment in one step.</p>

      <form id="register-form" class="space-y-4">

        <!-- Account details -->
        <p class="text-xs font-semibold text-blue-600 uppercase tracking-wide">Account Details</p>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">Username</label>
            <input id="reg-username" type="text" required placeholder="e.g. john_doe"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-purple-400 outline-none"/>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">Password</label>
            <input id="reg-password" type="password" required placeholder="Min 8 chars"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-purple-400 outline-none"/>
          </div>
        </div>

        <!-- Personal info -->
        <p class="text-xs font-semibold text-blue-600 uppercase tracking-wide pt-1">Personal Information</p>
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">Full Name</label>
          <input id="reg-fullname" type="text" required placeholder="e.g. John Doe"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-purple-400 outline-none"/>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">Date of Birth</label>
            <input id="reg-dob" type="date" required
              class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-purple-400 outline-none"/>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">Gender</label>
            <select id="reg-gender" required
              class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-purple-400 outline-none">
              <option value="">Select…</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">Phone (optional)</label>
            <input id="reg-phone" type="tel" placeholder="+1-555-0000"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-purple-400 outline-none"/>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">Blood Group (optional)</label>
            <select id="reg-blood"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-purple-400 outline-none">
              <option value="">Unknown</option>
              <option>A+</option><option>A-</option>
              <option>B+</option><option>B-</option>
              <option>AB+</option><option>AB-</option>
              <option>O+</option><option>O-</option>
            </select>
          </div>
        </div>

        <!-- Book first appointment -->
        <p class="text-xs font-semibold text-blue-600 uppercase tracking-wide pt-1">Book Your First Appointment</p>
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">Choose a Doctor</label>
          <select id="reg-doctor" required
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-purple-400 outline-none">
            <option value="">Loading doctors…</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">Date & Time</label>
            <input id="reg-datetime" type="datetime-local" required
              class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-purple-400 outline-none"/>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">Reason (optional)</label>
            <input id="reg-reason" type="text" placeholder="e.g. Check-up"
              class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-purple-400 outline-none"/>
          </div>
        </div>

        <div id="reg-error" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2"></div>

        <button id="reg-btn" type="submit"
          class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2.5 rounded-lg transition text-sm mt-2">
          Register &amp; Book Appointment
        </button>
      </form>

      <p class="text-center text-xs text-gray-400 mt-4">
        Already have an account?
        <button onclick="switchTab('login')" class="text-blue-600 hover:underline font-medium">Sign in</button>
      </p>
    </div>
  </div>

  <script>
    if (Auth.isLoggedIn()) redirectByRole();

    // ── Tab switching ────────────────────────────────────────────────────────
    function switchTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('panel-login').classList.toggle('hidden', !isLogin);
      document.getElementById('panel-register').classList.toggle('hidden', isLogin);
      document.getElementById('tab-login').className    = isLogin
        ? 'flex-1 py-2 text-sm font-semibold rounded-lg bg-white text-blue-700 transition'
        : 'flex-1 py-2 text-sm font-semibold rounded-lg text-white/70 hover:text-white transition';
      document.getElementById('tab-register').className = !isLogin
        ? 'flex-1 py-2 text-sm font-semibold rounded-lg bg-white text-purple-700 transition'
        : 'flex-1 py-2 text-sm font-semibold rounded-lg text-white/70 hover:text-white transition';
    }

    // ── Login ────────────────────────────────────────────────────────────────
    const loginBtn = document.getElementById("login-btn");
    const errMsg   = document.getElementById("error-msg");

    document.getElementById("toggle-pw").addEventListener("click", () => {
      const pw = document.getElementById("password");
      pw.type = pw.type === "password" ? "text" : "password";
    });

    document.getElementById("demo-btns").addEventListener("click", e => {
      const btn = e.target.closest(".demo-btn");
      if (!btn) return;
      document.getElementById("username").value = btn.dataset.u;
      document.getElementById("password").value = btn.dataset.p;
    });

    document.getElementById("login-form").addEventListener("submit", async e => {
      e.preventDefault();
      errMsg.classList.add("hidden");
      showSpinner(loginBtn, "Signing in…");
      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value,
          }),
        });
        if (!res.ok) throw new Error((await res.json()).detail || "Login failed");
        Auth.setSession(await res.json());
        redirectByRole();
      } catch (err) {
        errMsg.textContent = err.message;
        errMsg.classList.remove("hidden");
      } finally {
        hideSpinner(loginBtn);
      }
    });

    // ── Load doctors for register dropdown (public, no auth) ─────────────────
    async function loadDoctorsForRegister() {
      try {
        const res     = await fetch("/api/doctors/public");
        const doctors = await res.json();
        const sel     = document.getElementById("reg-doctor");
        if (!doctors.length) {
          sel.innerHTML = '<option value="">No doctors available</option>';
          return;
        }
        sel.innerHTML = doctors.map(d =>
          `<option value="${d.id}">${d.full_name} — ${d.specialization} ($${parseFloat(d.fees).toFixed(2)})</option>`
        ).join('');
      } catch (e) {
        document.getElementById("reg-doctor").innerHTML = '<option value="">Failed to load</option>';
      }
    }
    loadDoctorsForRegister();

    // ── Register ─────────────────────────────────────────────────────────────
    const regBtn   = document.getElementById("reg-btn");
    const regError = document.getElementById("reg-error");

    document.getElementById("register-form").addEventListener("submit", async e => {
      e.preventDefault();
      regError.classList.add("hidden");
      showSpinner(regBtn, "Registering…");
      try {
        const res = await fetch("/api/auth/register-patient", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username:     document.getElementById("reg-username").value.trim(),
            password:     document.getElementById("reg-password").value,
            full_name:    document.getElementById("reg-fullname").value.trim(),
            dob:          document.getElementById("reg-dob").value,
            gender:       document.getElementById("reg-gender").value,
            phone:        document.getElementById("reg-phone").value || null,
            blood_group:  document.getElementById("reg-blood").value || null,
            doctor_id:    parseInt(document.getElementById("reg-doctor").value),
            scheduled_at: document.getElementById("reg-datetime").value,
            reason:       document.getElementById("reg-reason").value || null,
          }),
        });
        if (!res.ok) throw new Error((await res.json()).detail || "Registration failed");
        const session = await res.json();
        Auth.setSession(session);
        showToast("Account created & appointment booked!", "success");
        setTimeout(() => window.location.href = "/patient_portal.html", 800);
      } catch (err) {
        regError.textContent = err.message;
        regError.classList.remove("hidden");
      } finally {
        hideSpinner(regBtn);
      }
    });
  </script>
</body>
</html>
